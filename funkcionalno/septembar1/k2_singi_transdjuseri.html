<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kolokvijum II — Workflow i Task, sa transdjuserima</title>
  </head>
  <body>
    <p>
      Ista verzija kao k2_singi.html, ali sa transdjuserima u strogom smislu:
      transdjuser je funkcija koja prima redjuser i vraca redjuser. Zbog toga se
      ovde koristi reduce. Sve ostalo je isto — function konstruktori, privatni
      atributi kroz zatvorenje, Object.defineProperty za izvedena svojstva.
    </p>
    <script>
      // ── Task ───────────────────────────────────────────────────────────

      const Task = function (naziv, definicija) {
        this.naziv = naziv;
        this.definicija = definicija;

        this.execute = async function (...argumenti) {
          return definicija(...argumenti);
        };
      };

      // ── krajnji redjuseri ──────────────────────────────────────────────
      // Ovi odlucuju STA je ishod obrade: niz, broj, tekst...

      const sakupi = function (niz, element) {
        return [...niz, element];
      };

      const prebroj = function (broj) {
        return broj + 1;
      };

      // ── transdjuseri ───────────────────────────────────────────────────
      // Transdjuser prima SLEDECI redjuser i vraca redjuser. Zato se moze
      // nizati: izlaz spajanja je opet nesto sto reduce razume.

      const preslikaj = function (posao) {
        return function (sledeci) {
          return function (stanje, element) {
            return sledeci(stanje, posao(element));
          };
        };
      };

      const izdvoj = function (provera) {
        return function (sledeci) {
          return function (stanje, element) {
            return provera(element) ? sledeci(stanje, element) : stanje;
          };
        };
      };

      // Spaja transdjusere u jedan. Ide unazad, da bi redosled pisanja
      // bio i redosled kroz koji element prolazi.
      const poredjaj = function (...transdjuseri) {
        return function (kraj) {
          let veza = kraj;
          for (let i = transdjuseri.length - 1; i >= 0; i--) {
            veza = transdjuseri[i](veza);
          }
          return veza;
        };
      };

      // ── izravnavanje ───────────────────────────────────────────────────

      const izravnaj = function (zadaci) {
        return zadaci.flatMap((z) =>
          typeof z[Symbol.iterator] === "function" ? [...z] : [z],
        );
      };

      // ── Workflow ───────────────────────────────────────────────────────

      const Workflow = function (naziv, autor, zadaci = []) {
        this.naziv = naziv;
        this.autor = autor;

        Object.defineProperty(this, "zadaci", {
          get() {
            return [...zadaci];
          },
          enumerable: true,
        });

        this[Symbol.iterator] = function* () {
          for (const zadatak of zadaci) {
            yield zadatak;
          }
        };

        this.map = function (f) {
          return new Workflow(naziv, autor, zadaci.map(f));
        };

        this.filter = function (p) {
          return new Workflow(naziv, autor, zadaci.filter(p));
        };

        this.flat = function () {
          return new Workflow(naziv, autor, izravnaj(zadaci));
        };

        this.flatMap = function (f) {
          return new Workflow(naziv, autor, izravnaj(zadaci.map(f)));
        };

        this.execute = async function (...argumenti) {
          let ulaz = argumenti;
          for (const zadatak of zadaci) {
            ulaz = [await zadatak.execute(...ulaz)];
          }
          return ulaz[0];
        };

        // OVO je trazena modifikacija: nad workflow-om se moze primeniti
        // proizvoljna kompozicija transdjusera.
        //   transduce — jedan prolaz do bilo kakvog ishoda
        //   primeni   — isti prolaz, ali je ishod opet Workflow
        this.transduce = function (transdjuser, kraj = sakupi, pocetno = []) {
          return zadaci.reduce(transdjuser(kraj), pocetno);
        };

        this.primeni = function (...transdjuseri) {
          return new Workflow(
            naziv,
            autor,
            zadaci.reduce(poredjaj(...transdjuseri)(sakupi), []),
          );
        };
      };

      // ── trazeni transdjuser: ispis svakog koraka izvrsavanja ───────────
      // Obican preslikaj, samo sto svaki zadatak zamenjuje NOVIM zadatkom
      // koji oko izvrsavanja dopisuje ispis. Original se ne dira.

      const saIspisom = preslikaj(function (zadatak) {
        return new Task(zadatak.naziv, async function (...argumenti) {
          console.log("   ->", zadatak.naziv, "ulaz:", ...argumenti);
          const rezultat = await zadatak.execute(...argumenti);
          console.log("   <-", zadatak.naziv, "izlaz:", rezultat);
          return rezultat;
        });
      });

      const saMerenjem = preslikaj(function (zadatak) {
        return new Task(zadatak.naziv, async function (...argumenti) {
          const pocetak = Date.now();
          const rezultat = await zadatak.execute(...argumenti);
          console.log("   *", zadatak.naziv + ":", Date.now() - pocetak, "ms");
          return rezultat;
        });
      });

      // ═══════════════════════════════════════════════════════════════════
      // Testiranje
      // ═══════════════════════════════════════════════════════════════════

      const demo = async function () {
        const parsiraj = new Task("parsiraj", (tekst) => tekst.split(",").map(Number));
        const bezNula = new Task("bezNula", (niz) => niz.filter((x) => x !== 0));
        const kvadrati = new Task("kvadrati", (niz) => niz.map((x) => x * x));
        const zbir = new Task("zbir", (niz) => niz.reduce((a, x) => a + x, 0));
        const formatiraj = new Task("formatiraj", (x) => "ukupno: " + x);
        const cekaj = new Task("cekaj", async (x) => {
          await new Promise((k) => setTimeout(k, 20));
          return x;
        });
        const saberi = new Task("saberi", (a, b, c) => a + b + c);
        const puta10 = new Task("puta10", (x) => x * 10);

        const priprema = new Workflow("priprema", "Blagoje", [parsiraj, bezNula]);
        const racun = new Workflow("racun", "Blagoje", [kvadrati, cekaj, zbir]);
        const glavni = new Workflow("glavni", "Blagoje", [priprema, racun, formatiraj]);
        const ravan = glavni.flat();

        console.log("=== Task i Workflow rade kao i pre ===");
        console.log("execute sa tri argumenta:", await saberi.execute(1, 2, 3));
        console.log("iterisanjem:", [...priprema].map((z) => z.naziv));
        console.log("flat:", [...ravan].map((z) => z.naziv));
        console.log("lancano izvrsavanje:", await ravan.execute("1,0,2,3"));
        console.log("prvi dobija sve argumente:", await new Workflow("t", "B", [saberi, puta10]).execute(2, 3, 5));

        console.log("=== transduce: jedan prolaz, razlicit ishod ===");
        console.log("nazivi zadataka:", ravan.transduce(preslikaj((z) => z.naziv)));
        console.log("broj zadataka:  ", ravan.transduce(preslikaj((z) => z), prebroj, 0));
        console.log("duzine naziva:  ", ravan.transduce(preslikaj((z) => z.naziv.length)));

        console.log("=== kompozicija: izdvoj pa preslikaj, u JEDNOM prolazu ===");
        console.log(
          "nazivi bez cekaj:",
          ravan.transduce(
            poredjaj(izdvoj((z) => z.naziv !== "cekaj"), preslikaj((z) => z.naziv)),
          ),
        );

        console.log("=== dokaz da je prolaz jedan ===");
        const dnevnikDva = [];
        ravan.zadaci
          .filter((z) => {
            dnevnikDva.push("provera " + z.naziv);
            return z.naziv !== "cekaj";
          })
          .map((z) => {
            dnevnikDva.push("uzimanje " + z.naziv);
            return z.naziv;
          });

        const dnevnikJedan = [];
        ravan.transduce(
          poredjaj(
            izdvoj((z) => {
              dnevnikJedan.push("provera " + z.naziv);
              return z.naziv !== "cekaj";
            }),
            preslikaj((z) => {
              dnevnikJedan.push("uzimanje " + z.naziv);
              return z.naziv;
            }),
          ),
        );

        console.log("filter pa map:", dnevnikDva.join(" -> "));
        console.log("transdjuseri: ", dnevnikJedan.join(" -> "));

        console.log("=== primeni: rezultat je opet Workflow ===");
        console.log("primeni(saIspisom) — ispis svakog koraka:");
        console.log("rezultat:", await ravan.primeni(saIspisom).execute("1,0,2,3"));

        console.log("proizvoljna kompozicija: izdvoj pa saIspisom");
        const bezCekanja = ravan.primeni(izdvoj((z) => z.naziv !== "cekaj"), saIspisom);
        console.log("broj zadataka:", bezCekanja.zadaci.length);
        console.log("rezultat:", await bezCekanja.execute("4,0,5"));

        console.log("drugi transdjuser, isti mehanizam:");
        console.log("rezultat:", await ravan.primeni(saMerenjem).execute("1,0,2,3"));

        console.log("oba zajedno:");
        console.log("rezultat:", await ravan.primeni(saMerenjem, saIspisom).execute("1,0,2"));

        console.log("=== original netaknut ===");
        console.log("zadaci:", [...ravan].map((z) => z.naziv));
        console.log("prvi zadatak nije obmotan:", ravan.zadaci[0] === parsiraj);
        console.log("i dalje daje isto:", await ravan.execute("1,0,2,3"));
      };

      demo();
    </script>
  </body>
</html>
