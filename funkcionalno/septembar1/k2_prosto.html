<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <title>Kolokvijum II — najprostije rešenje (bez transdjusera)</title>
  </head>
  <body>
    <script>
      // ═══════════════════════════════════════════════════════════════
      // Kolokvijum II — najprostije rešenje koje ispunjava zahteve
      // (bez transdjusera)
      //
      // Rezultat se vidi u konzoli pregledača (F12 → Console).
      // U <script> nema await na najvišem nivou, pa je demonstracija
      // u funkciji demo() koja se poziva na dnu.
      // ═══════════════════════════════════════════════════════════════


      // ── Task ───────────────────────────────────────────────────────
      // execute prima proizvoljan broj argumenata i prosleđuje ih
      // definiciji; async čini da uvek vraća Promise.

      const Task = (naziv, definicija) => ({
          naziv,
          definicija,
          execute: async (...argumenti) => definicija(...argumenti)
      });


      // ── pomoćno: izravnavanje jednog nivoa ─────────────────────────
      // Workflow je iterabilan, pa se ugnježđeni workflow raspakuje
      // isto kao niz.

      const izravnaj = niz => niz.flatMap(z => z[Symbol.iterator] ? [...z] : [z]);


      // ── Workflow ───────────────────────────────────────────────────

      const Workflow = (naziv, autor, zadaci = []) => ({
          naziv, autor, zadaci,

          // iterisanjem se dobijaju pojedinačni Task objekti
          *[Symbol.iterator]() { yield* zadaci; },

          map:     f => Workflow(naziv, autor, zadaci.map(f)),
          filter:  p => Workflow(naziv, autor, zadaci.filter(p)),
          flat:    () => Workflow(naziv, autor, izravnaj(zadaci)),
          flatMap: f => Workflow(naziv, autor, izravnaj(zadaci.map(f))),

          // Lanac Promise-a: akumulator nosi ULAZ sledećeg koraka, uvek
          // kao niz argumenata. Prvi zadatak dobija sve argumente,
          // svaki sledeći samo rezultat prethodnog.
          execute: (...argumenti) =>
              zadaci
                  .reduce((tok, zadatak) => tok
                              .then(ulaz => zadatak.execute(...ulaz))
                              .then(rezultat => [rezultat]),
                          Promise.resolve(argumenti))
                  .then(([poslednji]) => poslednji)
      });


      // ═══════════════════════════════════════════════════════════════
      // Demonstracija
      // ═══════════════════════════════════════════════════════════════

      const demo = async () => {

          const parsiraj   = Task("parsiraj",   tekst => tekst.split(",").map(Number));
          const bezNula    = Task("bezNula",    niz => niz.filter(x => x !== 0));
          const kvadrati   = Task("kvadrati",   niz => niz.map(x => x * x));
          const zbir       = Task("zbir",       niz => niz.reduce((s, x) => s + x, 0));
          const formatiraj = Task("formatiraj", x => `ukupno: ${x}`);
          const cekaj      = Task("cekaj",      async x => { await new Promise(k => setTimeout(k, 20)); return x; });
          const saberi     = Task("saberi",     (a, b, c) => a + b + c);
          const puta10     = Task("puta10",     x => x * 10);

          console.log("=== Task ===");
          console.log("naziv:", parsiraj.naziv, "| definicija:", typeof parsiraj.definicija);
          console.log("execute jedan argument: ", await parsiraj.execute("1,0,2,3"));
          console.log("execute tri argumenta:  ", await saberi.execute(1, 2, 3));
          console.log("rezultat je rezultat definicije:", await zbir.execute([1, 4, 9]));
          console.log("execute je asinhron:", parsiraj.execute("1") instanceof Promise);
          console.log("i definicija sme biti asinhrona:", await cekaj.execute(7));

          console.log("\n=== Workflow ===");
          const priprema = Workflow("priprema", "Blagoje", [parsiraj, bezNula]);
          const racun    = Workflow("racun",    "Blagoje", [kvadrati, cekaj, zbir]);
          const glavni   = Workflow("glavni",   "Blagoje", [priprema, racun, formatiraj]);

          console.log("naziv:", priprema.naziv, "| autor:", priprema.autor);
          console.log("spisak zadataka:", priprema.zadaci.map(z => z.naziv));

          console.log("\n=== iterabilnost ===");
          for (const z of priprema) console.log("  clan:", z.naziv, "| ima definiciju:", typeof z.definicija);
          console.log("spread:", [...priprema].map(z => z.naziv));

          console.log("\n=== map, filter, flat, flatMap ===");
          const ravan = glavni.flat();
          console.log("ugnjezden:  ", [...glavni].map(z => z.naziv));
          console.log("posle flat: ", [...ravan].map(z => z.naziv));
          console.log("filter:     ", [...ravan.filter(z => z.naziv !== "cekaj")].map(z => z.naziv));
          console.log("map:        ", [...ravan.map(z => Task(z.naziv.toUpperCase(), z.definicija))].map(z => z.naziv));
          console.log("flatMap:    ", [...priprema.flatMap(z => Workflow("par", "Blagoje", [z, Task("kroz", x => x)]))].map(z => z.naziv));
          console.log("original netaknut:", [...glavni].map(z => z.naziv));

          console.log("\n=== execute ===");
          console.log("lancano, ulaz '1,0,2,3':", await ravan.execute("1,0,2,3"));
          console.log("  [1,0,2,3] -> [1,2,3] -> [1,4,9] -> 14 -> tekst");
          console.log("ugnjezden daje isto:    ", await glavni.execute("1,0,2,3"));
          console.log("bez sporog koraka:      ", await ravan.filter(z => z.naziv !== "cekaj").execute("4,0,5"));

          console.log("\nprvi zadatak dobija SVE argumente:",
                      await Workflow("tri ulaza", "Blagoje", [saberi, puta10]).execute(2, 3, 5), "= (2+3+5)*10");
          console.log("povratna vrednost je rezultat POSLEDNJEG:",
                      await Workflow("dva koraka", "Blagoje", [parsiraj, zbir]).execute("1,2,3"));
          console.log("execute je asinhron:", ravan.execute("1") instanceof Promise);

          console.log("\n=== zadaci se izvrsavaju redom ===");
          const trag = [];
          const spor = Task("spor", async x => { await new Promise(k => setTimeout(k, 30)); trag.push("spor"); return x; });
          const brz  = Task("brz",  x => (trag.push("brz"), x));
          await Workflow("redosled", "Blagoje", [spor, brz]).execute(1);
          console.log("redosled tragova:", trag, "— brz je cekao spor");
      };

      demo().catch(greska => console.error("demo pao:", greska));
    </script>
  </body>
</html>
