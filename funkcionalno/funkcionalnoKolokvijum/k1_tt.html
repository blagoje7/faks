<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const Transakcija = (() => {
        let brojac = 0;
        const STATUSI = ["nerealizovana", "realizovana", "stornirana"];
        const TIPOVI = ["na teret", "u korist"];

        return function (brojRacuna, opis, status, datum, tip, iznos) {
          // provera pre brojaca — neuspeo pokusaj ne trosi redni broj
          if (!STATUSI.includes(status)) {
            throw new Error("Nedozvoljen status: " + status);
          }
          if (!TIPOVI.includes(tip)) {
            throw new Error("Nedozvoljen tip: " + tip);
          }

          brojac++;
          const redniBroj = brojac;

          this.brojRacuna = brojRacuna;
          this.opis = opis;
          this.status = status;
          this.datum = datum;
          this.tip = tip;
          this.iznos = iznos;

          Object.defineProperty(this, "redniBroj", {
            get() {
              return redniBroj;
            },
            enumerable: true,
          });
        };
      })();

      // glavna knjiga
      const GlavnaKnjiga = function (
        naziv,
        maticniBroj,
        pib,
        transakcije = [],
        prethodna = null,
      ) {
        this.naziv = naziv;
        this.maticniBroj = maticniBroj;
        this.pib = pib;
        this.prethodna = prethodna;

        Object.defineProperty(this, "transakcije", {
          get() {
            return [...transakcije];
          },
          enumerable: true,
        });

        Object.defineProperty(this, "stanje", {
          get() {
            return transakcije
              .filter((t) => t.status === "realizovana")
              .reduce(
                (acc, t) =>
                  t.tip === "u korist" ? acc + t.iznos : acc - t.iznos,
                0,
              );
          },
          enumerable: true,
        });

        this.dodajTransakciju = function (transakcija) {
          return new GlavnaKnjiga(
            naziv,
            maticniBroj,
            pib,
            [...transakcije, transakcija],
            this,
          );
        };

        this.ukloniTransakciju = function (redniBroj) {
          return new GlavnaKnjiga(
            naziv,
            maticniBroj,
            pib,
            transakcije.filter((t) => t.redniBroj !== redniBroj),
            this,
          );
        };
      };

      const istorija = function (knjiga) {
        return knjiga === null ? [] : [...istorija(knjiga.prethodna), knjiga];
      };

      const stornirana = function (t) {
        return { ...t, status: "stornirana" };
      };

      const pretraga = function (kriterijumi, knjiga) {
        return kriterijumi.reduce(
          (niz, k) => niz.filter(k),
          knjiga.transakcije,
        );
      };

      const realizovane = (t) => t.status === "realizovana";
      const naTeret = (t) => t.tip === "na teret";
      const preko = (granica) => (t) => t.iznos > granica;

      const opoziv = function (knjiga, redniBrojUIstoriji) {
        const verzije = istorija(knjiga);
        const stara = verzije[redniBrojUIstoriji];

        const brojeviStare = stara.transakcije.map((t) => t.redniBroj);

        const nastaleKasnije = verzije
          .filter((v, i) => i > redniBrojUIstoriji) 
          .reduce((niz, v) => [...niz, ...v.transakcije], []) 
          .filter((t) => brojeviStare.indexOf(t.redniBroj) === -1) 
          .filter(
            (t, i, niz) =>
              niz.findIndex((x) => x.redniBroj === t.redniBroj) === i,
          ) 
          .map(stornirana); 

        return new GlavnaKnjiga(
          knjiga.naziv,
          knjiga.maticniBroj,
          knjiga.pib,
          [...stara.transakcije, ...nastaleKasnije],
          knjiga,
        );
      };


      //=====

        const t1 = new Transakcija("265-1", "Uplata",  "realizovana",   "2026-08-01", "u korist", 120000);
        const t2 = new Transakcija("265-1", "Zakup",   "realizovana",   "2026-08-03", "na teret",  45000);
        const t3 = new Transakcija("265-2", "Nabavka", "nerealizovana", "2026-09-01", "na teret",  90000);

        const k0 = new GlavnaKnjiga("Merkur", "214", "108");
        const k1 = k0.dodajTransakciju(t1);
        const k2 = k1.dodajTransakciju(t2);
        const k3 = k2.dodajTransakciju(t3);
        const op = opoziv(k3, 1);

        console.log("redni brojevi:", [t1.redniBroj, t2.redniBroj, t3.redniBroj], "| brojac spolja:", typeof brojac);
        try { new Transakcija("265-1", "X", "izmisljen", "2026-08-04", "u korist", 1); }
        catch (g) { console.log("2 odbijeno:", g.message); }
        console.log("knjiga:", k3.naziv, k3.maticniBroj, k3.pib, "|", k3.transakcije.map((t) => t.opis));
        console.log("stanje:", k3.stanje, "| prazna:", k0.stanje);
        console.log("dodaj -> ukloni:", k2.transakcije.length, k3.transakcije.length, k3.ukloniTransakciju(t2.redniBroj).transakcije.length, "| original ostao:", k3.transakcije.length, "| nove instance:", k2 !== k3);
        console.log("prethodna:", k3.prethodna === k2, "| istorija:", istorija(k3).map((k) => k.stanje));
        console.log("pretraga:", pretraga([realizovane], k3).map((t) => t.opis), "| dva:", pretraga([realizovane, naTeret], k3).map((t) => t.opis), "| preko 50000:", pretraga([preko(50000)], k3).map((t) => t.opis));
        console.log("opoziv:", op.transakcije.map((t) => t.opis + "(" + t.status + ")"));
        console.log("stanje:", op.stanje, "= verzija 1:", istorija(k3)[1].stanje, "| originali:", t2.status, t3.status);
    </script>
  </body>
</html>
