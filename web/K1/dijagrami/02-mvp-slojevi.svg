  <title>Tri sloja odozgo nadole: View kao Vue komponente, Presenter kao Flask blueprints, Model kao SQLAlchemy entiteti, ispod njih MySQL baza; između View-a i Presentera je granica procesa preko koje ide HTTP</title>
            <defs>
              <marker id="str2" viewBox="0 0 10 10" refX="9" refY="5"
