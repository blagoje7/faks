<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="color:#12211f;background:#ffffff" viewBox="0 0 700 470" role="img" class="svg-usko"
            aria-label="Tri sloja odozgo nadole: View kao Vue komponente, Presenter kao Flask blueprints, Model kao SQLAlchemy entiteti, ispod njih MySQL baza; između View-a i Presentera je granica procesa preko koje ide HTTP">
  <style>
